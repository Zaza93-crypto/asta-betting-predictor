name: Update football data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch fixtures
        env:
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
        run: python scripts/fetch_data.py

      - name: Generate predictions
        run: python scripts/predict.py

      - name: Commit updated data
        run: |
          git config user.name "asta-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/fixtures.json data/predictions.json
          git diff --cached --quiet || git commit -m "Update football data and predictions"
          git push
