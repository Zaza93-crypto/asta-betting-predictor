name: Update football data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch fixtures
        env:
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
        run: python scripts/fetch_data.py

      - name: Generate Asta V3 predictions
        run: python scripts/predict.py

      - name: Commit updated V3 data
        run: |
          git config user.name "asta-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/fixtures.json
          git add data/predictions.json
          git add data/prediction_history.json

          git diff --cached --quiet || git commit -m "Update Asta V3 predictions and tracking"

          git push
