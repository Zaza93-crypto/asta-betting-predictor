name: Asta Historical Backtest

on:
  workflow_dispatch:
  schedule:
    - cron: "30 5 * * 1"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch historical results
        env:
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
        run: python scripts/fetch_history.py

      - name: Run chronological backtest
        run: python scripts/backtest.py

      - name: Commit backtest report
        run: |
          git config user.name "asta-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/historical_matches.json data/backtest_report.json
          git diff --cached --quiet || git commit -m "Update historical backtest"
          git push
