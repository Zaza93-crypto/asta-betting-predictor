name: Asta V3 Final Backtest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest-v3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run final V3 walk-forward backtest
        run: python scripts/backtest.py

      - name: Commit final V3 report
        run: |
          git config user.name "asta-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/backtest_report.json
          git diff --cached --quiet || git commit -m "Finalize Asta V3 backtest"
          git push
